# Everything the Bootstrap sets up that does not come from Homebrew.
# This file is also the global mise config: `bootstrap.sh` links ~/.config/mise to this repo.
# Homebrew's Packages are in the Brewfile. `bootstrap.sh` runs both.

# --- Packages ---------------------------------------------------------------
[tools]
node = "lts"
"npm:sfw" = "latest"

[settings]
npm.package_manager = "pnpm"

# Packages that come from uv or from their own installer. Runs on every Bootstrap.
[tasks.bootstrap]
run = '''
uv python install
[ -x "$HOME/.local/bin/claude" ] || curl -fsSL https://claude.ai/install.sh | bash
'''

# Upgrades, one Install channel after another, every Package that Homebrew, uv and pnpm have installed, declared in this repo
# or not, the tools of this config, and Claude Code. A Package from another installer of its own, such as pi, is not upgraded.
# Never part of the Bootstrap: run it as `mise run upgrade`. It stops at the first step that fails.
# `--greedy-auto-updates` adds the casks that update themselves. `--greedy` would also reinstall
# every cask whose version is `:latest`, on every run.
[tasks.upgrade]
run = '''
brew update
brew upgrade --greedy-auto-updates
mise upgrade
uv python upgrade
uv tool upgrade --all
pnpm update -g
claude update
'''

# --- Machine values ---------------------------------------------------------
# `bootstrap.sh` asks for the hostname and reads the public key from 1Password's SSH agent.
[bootstrap.secrets]
hostname = { env = "BOOTSTRAP_HOSTNAME", description = "Hostname of this Mac" }
ssh_public_key = { env = "BOOTSTRAP_SSH_PUBLIC_KEY", description = "Public key of this Mac's SSH key" }

# --- Dotfiles ---------------------------------------------------------------
[dotfiles]
"~/.zprofile" = "dotfiles/zsh/zprofile"
"~/.zshrc" = "dotfiles/zsh/zshrc"
"~/.config/starship.toml" = "dotfiles/starship/starship.toml"
"~/.config/ghostty/config.ghostty" = "dotfiles/ghostty/config.ghostty"
"~/.config/git/config" = "dotfiles/git/config"
"~/.config/git/ignore" = "dotfiles/git/ignore"
"~/.config/bat/config" = "dotfiles/bat/config"
"~/.ssh/config" = "dotfiles/ssh/config"
# Local files, written from Machine values.
"~/.config/git/config.local" = { source = "dotfiles/git/config.local.tera", mode = "template" }
"~/.config/1Password/ssh/agent.toml" = { source = "dotfiles/1password/agent.toml.tera", mode = "template" }

# --- macOS settings ---------------------------------------------------------
[bootstrap.macos.dock]
autohide = true
apps = [
  "/System/Applications/Apps.app",
  "/Applications/Ghostty.app",
  "/Applications/Google Chrome.app",
  "/Applications/Visual Studio Code.app",
  "/Applications/1Password.app",
  "/System/Applications/System Settings.app",
]

[bootstrap.macos.finder]
show_pathbar = true
show_extensions_warning = false

[bootstrap.macos.keyboard]
press_and_hold = false
key_repeat = 2
initial_key_repeat = 15
automatic_spelling_correction = false

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleInterfaceStyleSwitchesAutomatically = true, "com.apple.swipescrolldirection" = false, AppleShowAllExtensions = true, NSAutomaticQuoteSubstitutionEnabled = false, NSAutomaticDashSubstitutionEnabled = false }
"com.apple.finder" = { NewWindowTarget = "PfHm" }
"com.apple.screencapture" = { location = "~/Downloads", "disable-shadow" = true }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

# AirPlay Receiver off: it holds ports 5000 and 7000 on every network interface (CIS 2.3.1.2).
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "AirplayReceiverEnabled"
host = "current"
value = false

# Screen saver after 10 idle minutes, so with the 5-second lock delay an idle Mac locks within about 10 minutes (CIS 2.11.1).
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.screensaver"
key = "idleTime"
host = "current"
value = 600

# Hooks run on every Bootstrap, so a line that changes the Mac first reads the state and acts only when needed.
# The pre-defaults line only records the state, and final only prints the Steps by hand.
[bootstrap.hooks]
# Ghostty reads a config file in Application Support after the Dotfile, and Open Configuration opens it.
# An empty one is removed. A non-empty one is left as it is, and the run names it.
post-dotfiles = [
  'for name in config.ghostty config; do f="$HOME/Library/Application Support/com.mitchellh.ghostty/$name"; if [ -s "$f" ]; then echo "$f overrides the Ghostty Dotfile. Move its settings into ~/.config/ghostty/config.ghostty, then delete it."; elif [ -f "$f" ]; then rm "$f"; fi; done',
  # gh clones over SSH with this Mac's key, as git does. gh keeps its sign-in beside its config, so that is no Dotfile.
  '[ "$(gh config get git_protocol 2>/dev/null)" = ssh ] || gh config set git_protocol ssh',
]
# Fingerprints of what the Dock and Finder show, taken before mise applies the macOS settings. Each run overwrites the file.
# Finder's takes in the global AppleShowAllExtensions too, because Finder shows that setting only after a restart.
# The restart line removes the file, so a file already here means the last run stopped before its restart: the line then
# writes fingerprints that match nothing, and both restart.
pre-defaults = [
  'f="${TMPDIR:-/tmp}/macos-setup-dock-finder"; if [ -e "$f" ]; then printf "unfinished\nunfinished\n" >"$f"; else { defaults export com.apple.dock - | md5; { defaults export com.apple.finder -; defaults read NSGlobalDomain AppleShowAllExtensions; } 2>/dev/null | md5; } >"$f"; fi || true',
]
# Settings that need `sudo`, and the restart that shows the rest. mise reports no drift on these.
post-defaults = [
  'for name in ComputerName LocalHostName HostName; do [ "$(scutil --get $name 2>/dev/null)" = "$BOOTSTRAP_HOSTNAME" ] || sudo scutil --set $name "$BOOTSTRAP_HOSTNAME"; done',
  '/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate | grep -q enabled || sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on',
  '/usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode | grep -q "is on" || sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on',
  'grep -qs "^auth.*pam_tid\.so" /etc/pam.d/sudo_local || sed "s/^#auth/auth/" /etc/pam.d/sudo_local.template | sudo tee /etc/pam.d/sudo_local >/dev/null',
  'sysadminctl -screenLock status 2>&1 | grep -q "is 5 seconds" || sysadminctl -screenLock 5 -password -',
  # mise tells hooks nothing about what it changed, so this line reads the fingerprints again: the Dock or Finder restarts
  # only when its own differs from pre-defaults', and a re-run that changes nothing restarts neither. No file: both restart.
  'f="${TMPDIR:-/tmp}/macos-setup-dock-finder"; [ "$(sed -n 1p "$f" 2>/dev/null)" = "$(defaults export com.apple.dock - | md5)" ] || killall Dock || true; [ "$(sed -n 2p "$f" 2>/dev/null)" = "$( { defaults export com.apple.finder -; defaults read NSGlobalDomain AppleShowAllExtensions; } 2>/dev/null | md5)" ] || killall Finder || true; rm -f "$f"',
]
final = "cat ~/.config/mise/steps-by-hand.md"
